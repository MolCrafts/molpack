[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "molcrafts-molpack"
version = "0.8.0"
description = "Python bindings for molpack molecular packing (Packmol port)"
requires-python = ">=3.12"
readme = "README.md"
license = "BSD-3-Clause"
# The native API needs molpy 0.20.1; capsules also require matching source builds.
dependencies = [
  "numpy>=2.0",
  "molcrafts-molpy>=0.20.1,<0.21",
]

# Installable "extra" carrying the docs-build deps. Unlike the [dependency-groups]
# doc group below (dev/CI-only, installs deps but not the package), an extra ships
# in the wheel metadata, so a *prebuilt-wheel* install pulls it with no Rust build:
#   pip install "molcrafts-molpack[doc]"
# That is the build command a Cloudflare Pages Git-integration build should use.
[project.optional-dependencies]
doc = [
  "zensical>=0.0.53",
  "molcrafts-zensical-theme>=0.2.5",
]

# PEP 735 dependency groups — the single source of truth for dev-time
# deps used by .github/workflows/test.yml.
#
# Install with `pip install --group <name>` (pip 25.1+) from this directory.
[dependency-groups]
typecheck = [
  "ruff",
  "ty",
  "numpy>=2.0",
  "molcrafts-molpy>=0.20.1,<0.21",
  # `ty check` walks tests/ which imports pytest.
  "pytest",
]
test = [
  "pytest",
  "numpy>=2.0",
  "molcrafts-molpy>=0.20.1,<0.21",
]
dev = [
  {include-group = "typecheck"},
  {include-group = "test"},
  "maturin",
  "molcrafts-ci",
]
# Documentation build: `zensical build` reads zensical.toml (docs → site).
# Theme: `theme.name = "molcrafts"` (molcrafts-zensical-theme on PyPI).
doc = [
  "zensical>=0.0.53",
  # The molcrafts docs theme (zensical.toml sets `theme.name = "molcrafts"`).
  "molcrafts-zensical-theme>=0.2.5",
]

[project.urls]
Homepage = "https://github.com/MolCrafts/molpack"
Repository = "https://github.com/MolCrafts/molpack"

[tool.maturin]
python-source = "python"
module-name = "molpack.molpack"
features = ["rayon"]
exclude = [
  "python/molpack/*.so",
  "python/molpack/*.dylib",
  "python/molpack/*.dll",
  "python/molpack/*.dSYM",
  "python/molpack/*.dSYM/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `python -X warn_default_encoding -m pytest` (how the suite is run) makes
# every text-mode open without encoding= warn, and this makes the warning an
# error: Python would decode with the locale, cp1252 on Windows, so such a
# read passes on Linux and fails only on Windows. Ruff's PLW1514 catches it
# statically only where it can tell the receiver is a Path.
filterwarnings = ["error::EncodingWarning"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["python", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  # Text-mode file I/O names its encoding. Unnamed, Python decodes with the
  # locale -- cp1252 on Windows -- so a read that passes every Linux hook
  # fails only on CI's Windows leg. A preview rule: explicit-preview-rules
  # keeps every other preview rule off.
  "PLW1514",
]
preview = true
explicit-preview-rules = true
ignore = [
  "E501", # line too long — enforced by formatter, not linter
]

[tool.ruff.lint.isort]
known-first-party = ["molpack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.sources]
molcrafts-molpy = { path = "../../molpy/molpy", editable = true }
molcrafts-ci = { git = "https://github.com/MolCrafts/molcrafts-ci", rev = "48869e06449f68931f35ef05b8de98795a4faff6" }

[tool.ty]
[tool.ty.environment]
python-version = "3.12"
# tests import example scripts via sys.path.insert at runtime; ty cannot follow
# dynamic path manipulation, so we declare the examples dir as an extra source root.
extra-paths = ["examples"]
