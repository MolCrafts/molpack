name: release

# A `v*` tag on MolCrafts/molpack: .github/workflows/test.yml (every job), then
# crates.io (molcrafts-molpack), PyPI (Linux and universal2 macOS wheels for
# Python 3.12 and 3.13, plus the sdist), and the GitHub Release. molrs is
# checked out by setup-partners into ../molpy at the
# same repository and ref as .github/partners.env.
#
# A dispatch is the dry run, on any branch: the same CI and builds,
# `cargo publish --dry-run`, no upload and no Release. Only a tag push on
# MolCrafts uploads. Every upload skips a version the registry already has.
#
# Trusted publishing names this file, release.yml, and one environment per
# registry: crates-io, pypi. A dispatch never enters an environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # uv / maturin build molrs through its PEP 517 hook.
  MATURIN_PEP517_ARGS: "--locked"

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  context:
    name: release
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@48869e06449f68931f35ef05b8de98795a4faff6
    with:
      profile: molpack

  guard:
    name: release / guard
    permissions:
      contents: read
      actions: read
    needs: context
    if: needs.context.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: The tag is the package version, on master
        if: needs.context.outputs.publish == 'true'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::tag is not on master"; exit 1; }
      - name: Exact upstream master verification
        uses: MolCrafts/molcrafts-ci/actions/release-verify@48869e06449f68931f35ef05b8de98795a4faff6
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          profile: molpack
          publish: ${{ needs.context.outputs.publish }}

  crate:
    name: release / crate
    needs: [context, guard]
    if: needs.context.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@48869e06449f68931f35ef05b8de98795a4faff6
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@48869e06449f68931f35ef05b8de98795a4faff6
        with:
          cache: molpack-release
          workspaces: ../molpy -> target
      - run: cargo publish --dry-run --locked

  publish-crate:
    name: release / publish crate
    needs: [context, guard]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@48869e06449f68931f35ef05b8de98795a4faff6
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@48869e06449f68931f35ef05b8de98795a4faff6
        with:
          cache: molpack-release
          workspaces: ../molpy -> target
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)
          if curl -sfL -A "molpack-release/1.0" "https://crates.io/api/v1/crates/molcrafts-molpack/$version" >/dev/null; then
            echo "molcrafts-molpack@$version is already on crates.io"
            exit 0
          fi
          cargo publish --locked

  # One wheel per OS per supported Python; each macOS wheel is universal2.
  wheels:
    name: release / wheels (${{ matrix.os }}, ${{ matrix.python }})
    needs: [context, guard]
    if: needs.context.outputs.validate == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@48869e06449f68931f35ef05b8de98795a4faff6
        with:
          python-version: ${{ matrix.python }}
      # python/Cargo.toml path-deps ../../molpy; maturin runs cargo metadata
      # for every command, so molrs must be there and mounted into the
      # manylinux container at the same path.
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@48869e06449f68931f35ef05b8de98795a4faff6
      - name: Partner path
        run: echo "MOLPY_DIR=$(cd "$GITHUB_WORKSPACE/../molpy" && pwd)" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: python
          manylinux: auto
          docker-options: -v ${{ env.MOLPY_DIR }}:${{ env.MOLPY_DIR }}
          command: build
          args: >-
            --release --locked --out dist --interpreter python${{ matrix.python }}
            ${{ matrix.os == 'macos-latest' && '--target universal2-apple-darwin' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python }}
          path: python/dist

  sdist:
    name: release / sdist
    needs: [context, guard]
    if: needs.context.outputs.validate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@48869e06449f68931f35ef05b8de98795a4faff6
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@48869e06449f68931f35ef05b8de98795a4faff6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-sdist
          path: python/dist

  pypi:
    name: release / pypi
    needs: [context, guard, wheels, sdist]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist
          skip-existing: true

  github:
    name: release / github
    needs: [context, guard, publish-crate, pypi]
    if: needs.context.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
