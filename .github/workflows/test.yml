name: test
'on':
  push:
    branches:
    - dev
    - master
  pull_request:
    branches:
    - dev
    - master
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
jobs:
  context:
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    with:
      profile: molpack
  native:
    name: test / native
    needs: context
    if: needs.context.outputs.validate == 'true' && needs.context.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    - uses: MolCrafts/molcrafts-ci/actions/setup-partners@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@37946f34c4ca8f4fd7fd37761b1d3182444c72da
      with:
        cache: molpack
        workspaces: ../molpy -> target
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    - run: molci platform native
  platform:
    name: test / platform (${{ matrix.lane }})
    needs: context
    if: needs.context.outputs.validate == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: MolCrafts/molcrafts-ci/actions/setup-molci@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    - uses: MolCrafts/molcrafts-ci/actions/setup-partners@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    - uses: MolCrafts/molcrafts-ci/actions/setup-rust@37946f34c4ca8f4fd7fd37761b1d3182444c72da
      with:
        cache: molpack
        workspaces: ../molpy -> target
    - uses: MolCrafts/molcrafts-ci/actions/setup-python@37946f34c4ca8f4fd7fd37761b1d3182444c72da
    - run: molci platform ${{ matrix.lane }}
  result:
    name: test / result
    needs:
    - context
    - native
    - platform
    if: always() && (needs.context.result != 'success' || needs.context.outputs.validate != 'false')
    runs-on: ubuntu-latest
    steps:
    - uses: MolCrafts/molcrafts-ci/actions/validation-result@37946f34c4ca8f4fd7fd37761b1d3182444c72da
      with:
        needs: ${{ toJSON(needs) }}
