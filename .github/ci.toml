# What molpack checks. The same commands run in the git hooks
# (`molci check --stage pre-commit` / `--stage pre-push`) and in CI.
# [partners] must name the same repository and ref as .github/partners.env.

[env]
# uv builds molrs and molpack through maturin's PEP 517 hook.
MATURIN_PEP517_ARGS = "--locked"

[tools]
python = "3.12"
rust = true

[partners]
# The checkout directory stays `molrs`. The repository is the unified molpy project.
molrs = "MolCrafts/molpy@dev"

[check.hygiene]
stage = "pre-commit"
run = [
  "cargo fmt -- --check",
  "cargo fmt --manifest-path python/Cargo.toml -- --check",
  "uvx ruff@0.16.0 format --check --config python/pyproject.toml python/python python/tests python/examples",
  "uvx ruff@0.16.0 check --config python/pyproject.toml python/python python/tests python/examples",
  '''
if git grep -nI '[[:blank:]]$'; then
  echo "trailing whitespace" >&2
  exit 1
fi
''',
  '''
uv run --no-project --python 3.12 python - <<'PY'
import pathlib
import re
import subprocess
import sys

ignored = re.compile(r"```[a-z,_]*ignore|#\[ignore")
roots = ("src", "docs", "examples", "python/src")
bad = []
for root in roots:
    for path in pathlib.Path(root).rglob("*"):
        if path.suffix not in {".rs", ".md"} or not path.is_file():
            continue
        if ignored.search(path.read_text(encoding="utf-8", errors="replace")):
            bad.append(str(path))
tracked = set(subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"))
missing_nl = []
for raw in tracked:
    if not raw:
        continue
    path = pathlib.Path(raw.decode())
    if not path.is_file() or path.stat().st_size == 0:
        continue
    data = path.read_bytes()
    if b"\0" in data or data.endswith(b"\n"):
        continue
    missing_nl.append(str(path))
if bad or missing_nl:
    if bad:
        print("ignored test:\n" + "\n".join(bad))
    if missing_nl:
        print("missing final newline:\n" + "\n".join(missing_nl))
    sys.exit(1)
PY
''',
]

[check.locks]
run = '''
uv run --no-project --python 3.12 python - <<'PY'
import re
import tomllib
from pathlib import Path

env = Path(".github/partners.env").read_text(encoding="utf-8")

def val(key: str) -> str:
    match = re.search(rf"^{key}=(.+)$", env, re.M)
    if match is None:
        raise SystemExit(f".github/partners.env has no {key}")
    return match.group(1).strip()

pin = tomllib.loads(Path(".github/ci.toml").read_text(encoding="utf-8"))["partners"]["molrs"]
want = f"{val('MOLRS_REPOSITORY')}@{val('MOLRS_REF')}"
if pin != want:
    raise SystemExit(f"ci.toml partners.molrs is {pin!r}; partners.env says {want!r}")
PY
uv run --no-project --python 3.12 python scripts/partners.py check
cargo metadata --locked --format-version 1 >/dev/null
cargo metadata --locked --format-version 1 --manifest-path python/Cargo.toml >/dev/null
uv lock --check --directory python
'''

[check.clippy]
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[check.ty]
run = "uv run --locked --python 3.12 --directory python --group typecheck ty check python tests examples"

[check.rust]
run = [
  "cargo test --locked --lib --features cli",
  "cargo test --locked --doc --features cli",
  "cargo check --locked --all-targets --features cli",
  "cargo check --locked --no-default-features",
  "cargo check --locked --features rayon",
]

[check.python]
os = ["linux", "macos", "windows"]
run = "uv run --locked --python 3.12 --directory python --group dev tox -e py"

[check.docs]
rust = false
run = "uv run --isolated --locked --python 3.12 --project python --only-group doc zensical build --clean --strict"
