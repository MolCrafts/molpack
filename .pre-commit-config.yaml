# prek runs this on commit and on push. It lints .github/workflows.
# The checks themselves are the jobs in .github/workflows/ci.yml.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        pass_filenames: false
        always_run: true
